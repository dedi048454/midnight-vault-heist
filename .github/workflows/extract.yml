name: Extract uploaded zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip
        run: |
          ls -la
          unzip -l midnight-vault-heist.zip
          unzip -o midnight-vault-heist.zip
          rm -f midnight-vault-heist.zip
          for d in */; do if [ -f "$d/main.ts" ]; then echo "Flattening $d"; mv "$d"/* .; rmdir "$d"; fi; done
          ls -la
      - name: Commit extracted files
        run: |
          rm -rf .github
          git config user.name "dedi048454"
          git config user.email "dzmnrg@gmail.com"
          git add -A
          git status --short
          git commit -m "Extract midnight-vault-heist.zip contents" || echo "nothing to commit"
          git push
